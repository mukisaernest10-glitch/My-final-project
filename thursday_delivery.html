<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Form</title>
</head>

<body style="font-family: Arial, Helvetica, sans-serif;">
    <fieldset>
        <legend><strong>Delivery Information</strong></legend>
        <form action="submit_delivery.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select><br><br>

            <label for="delivery_time">Preferred Delivery Time:</label>
            <input type="time" id="delivery_time" name="delivery_time" required><br><br>

            <label for="location">Delivery Location:</label>
            <input type="text" id="location" name="location" required><br><br>

            <label for="delivery_date">Preferred Delivery Date:</label>
            <input type="date" id="delivery_date" name="delivery_date" required><br><br>

            <button type="submit">Deliver</button><br><br>
        </form>
        <a href="THURSDAY_PROJECT.HTML"><button>Back</button></a>
    </fieldset>
</body>

</html>
