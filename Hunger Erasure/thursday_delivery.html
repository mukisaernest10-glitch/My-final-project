<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Form</title>
    <link rel="stylesheet" href="Thursday_delivery.css">
</head>

<body style="font-family: Arial, Helvetica, sans-serif;">
    <fieldset>
        <legend><strong>Delivery Information</strong></legend>
        <form action="submit_delivery.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select><br><br>

            <label for="delivery_time">Preferred Delivery Time:</label>
            <input type="time" id="delivery_time" name="delivery_time" required><br><br>

            <label for="location">Delivery Location:</label>
            <input type="text" id="location" name="location" required><br><br>

            <label for="delivery_date">Preferred Delivery Date:</label>
            <input type="date" id="delivery_date" name="delivery_date" required><br><br>

            <label for="payment_method">Payment Method:</label>
            <select id="payment_method" name="payment_method" required>
                <option value="">Select Payment Method</option>
                <option value="credit_card">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="cash_on_delivery">Cash on Delivery</option>
            </select><br><br>
    </fieldset>
    <!-- items to be delivered -->
    <fieldset>
        <legend><strong>item(s)</strong></legend>

        <label for="item">Item Name:</label>
        <input type="text" id="item" name="item" required><br><br>

        <label for="weight">Weight <select name="weight" id="weight">
                <option value="kg">kg</option>
                <option value="g">g</option>
            </select>:</label>
        <input type="number" id="weight" name="weight" min="0" step="0.01" required><br><br>

        <label for="amount">Amount <select name="currency" id="currency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="UGX">UGX</option>
            </select>:</label>
        <input type="number" id="amount" name="amount" min="0" step="0.01" required><br><br>
        <button type="submit">Deliver</button><br><br>
        </form>
        <a href="Hunger_Erasure-1.html"><button>Back</button></a>
        <p>Thank you for choosing our delivery service!</p>
        </form>
    </fieldset>

</body>

</html>
