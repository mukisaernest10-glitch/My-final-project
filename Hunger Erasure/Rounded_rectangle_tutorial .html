<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounded rectangle tutorial</title>
    <link rel="stylesheet" href="Rounded_rectangle.css">
</head>

<body>
    <header>
        <div class="flex_container">
            <div class="left_container">
                <h1 style="color:rgb(4, 4, 51);"><strong>CodeAcademy</strong></h1>
            </div>
            <div class="right_box">
                <button class="rounded_btn">Get started</button>
                <p><strong>Register</strong></p>
            </div>
        </div>
    </header>
    <main>
        <div class="flex_container">
            <div class="left_container">
                <div id="build_skills">
                    <div id="build">
                        <p style="color: rgb(3, 3, 46); margin-bottom: 0;">Build Skills That</p>
                    </div>
                    <div id="Shape">
                        <p style="color: orange; margin-top: 0; margin-bottom: 0;">Shape Your Future.</p>
                    </div>
                </div>
                <div id="content">
                    <p style="margin-top: 0;">At Code Academy Uganda, we train children with practical technology Skills
                        and help them build
                        real-world projects.</p>
                </div>
                <button class="rounded_btn">Explore courses</button> <button id="border_btn">Learn more</button>
            </div>


            <div class="right_box">
                <img src="students.jpg" alt="Students learning">
                <div class="info_card">

                    <p style="color: orange;">100 %</p>

                    <p>practical lessons</p>
                </div>
            </div>
        </div>

    </main>
</body>

</html>
